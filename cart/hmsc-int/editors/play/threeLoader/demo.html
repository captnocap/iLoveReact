<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HMSC Three Loader</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090d12;
      color: #d8e3ea;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #090d12;
    }
    body {
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    .bar {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) auto auto auto;
      gap: 8px;
      align-items: center;
      padding: 8px;
      border-bottom: 1px solid #1c2a35;
      background: #0d141bcc;
      backdrop-filter: blur(12px);
    }
    input, select, button {
      height: 32px;
      border: 1px solid #2c4050;
      border-radius: 4px;
      background: #111b24;
      color: #d8e3ea;
      font: inherit;
      font-size: 13px;
    }
    input[type="text"] {
      width: 100%;
      padding: 0 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    select { padding: 0 8px; }
    button {
      padding: 0 14px;
      background: #1c3446;
      cursor: pointer;
    }
    button:hover { background: #25465f; }
    input[type="file"] {
      width: 210px;
      padding: 5px 8px;
    }
    .stage {
      position: relative;
      min-height: 0;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    .overlay {
      position: absolute;
      left: 10px;
      top: 10px;
      display: grid;
      gap: 5px;
      max-width: min(720px, calc(100vw - 20px));
      pointer-events: none;
    }
    .pill {
      width: fit-content;
      max-width: 100%;
      padding: 5px 7px;
      border: 1px solid #263846;
      border-radius: 4px;
      background: #091019d9;
      color: #a9c8d8;
      font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
    }
    #status { color: #75d6ff; }
    #notes {
      color: #d6bd7e;
      max-height: 140px;
      overflow: hidden;
    }
    .footer {
      min-height: 28px;
      padding: 6px 10px;
      border-top: 1px solid #1c2a35;
      background: #0d141b;
      color: #6f8794;
      font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (max-width: 760px) {
      .bar {
        grid-template-columns: 1fr auto;
      }
      input[type="file"] {
        width: 100%;
        grid-column: 1 / -1;
      }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div class="bar">
    <input id="path" type="text" value="/zig-out/game/hmsc.gamefile" aria-label="gamefile path" />
    <select id="mode" aria-label="compiled data type">
      <option value="gamefile">gamefile</option>
      <option value="map">map container</option>
    </select>
    <button id="load" type="button">Load</button>
    <input id="file" type="file" accept=".gamefile,.map,.rjmp,application/octet-stream" aria-label="local compiled file" />
  </div>
  <main class="stage">
    <canvas id="view"></canvas>
    <div class="overlay">
      <div id="status" class="pill">booting</div>
      <div id="stats" class="pill"></div>
      <div id="notes" class="pill"></div>
    </div>
  </main>
  <div class="footer">HMSC compiled data -> TypeScript loader -> Three.js instanced scene</div>
  <script type="module" src="./demo.bundle.js"></script>
</body>
</html>
