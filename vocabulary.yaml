  added_by: vocabulary_add
- term: days of work
  category: phrase
  definition: 'When the user (or Claude) says ''days of work'', it does NOT mean calendar
    days. It means: a sequence of tool calls, plus Claude staying motivated/coherent
    through the sequence. The two real currencies are (1) ordered tool calls, (2)
    sustained focus across them — not human-time. Connects to [[feedback-estimate-in-agent-time]]:
    ''1.5 days'' has historically been ~23 minutes of actual work.'
  antipatterns:
  - Do NOT defer or schedule something to 'next session' because it was framed as
    'days of work' — that's calendar-thinking and irrelevant
  - Do NOT propose multi-session plans, milestones, or checkpoints based on the 'days'
    framing — sequence the tool calls and just go
  - Do NOT halve and quarter the estimate then announce a number — just start; the
    real risk is losing motivation/coherence mid-sequence, not running out of time
  - Do NOT pad with 'let me know when you want me to continue' breaks — sustain through
    the sequence; motivation IS the constraint
  - Do NOT treat 'days of work' as permission to be slower or more careful — the unit
    is wrong; act at tool-call cadence regardless of how 'big' it sounds
  related_terms:
  - feedback_estimate_in_agent_time
  - feature request
  - experiment
  defined_in: CLAUDE.md
