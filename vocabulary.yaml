- term: didn't change from my POV
  category: phrase
  definition: 'A verdict the user delivers when nothing OBSERVABLE has changed — visually,
    behaviorally, or via signals like FPS — regardless of how much code shifted. The
    user runs on visual conformance and behavioristics of software; they are NOT reading
    code. Variants: ''looks the same'', ''same to me'', ''no difference here'', ''still
    doing X'', ''didn''t change''. Concrete example: 10 easings that all have the
    same performance numbers — they''re ''wildly different'' as code but didn''t change
    from POV because nothing observable separates them.'
  antipatterns:
  - Do NOT respond by listing what changed in the diff — diffs are not what the user
    is measuring against
  - Do NOT argue 'but the code is different now' — to the user this is a non-sequitur;
    only observable change counts
  - Do NOT claim victory based on logs, type-checking, build success, or tests — those
    are not POV signals
  - Do NOT treat 'didn't change from my POV' as a soft critique — it means the work
    effectively didn't ship; the visible outcome is what was requested and it is missing
  - Do NOT keep iterating in the same direction without changing what would be observable
    — if the user said this once, the next attempt has to produce a different visible/behavioral
    result
  related_terms:
  - frames
  - feature request
  - user_role
  defined_in: CLAUDE.md
  added_at: '2026-05-18T17:25:51.664330+00:00'
  added_by: vocabulary_add
- term: experiment
  category: noun
  definition: 'When the user asks for an experiment, test, or ''try this'', they are
    NOT signaling that the code is disposable. If the outcome is positive, the code
    stays and is integrated into the long-lasting codebase. Synonyms in this sense:
    experiment, test, try, poke at, see if. The disposability is in the IDEA, not
    the implementation.'
  antipatterns:
  - Do NOT write experiments as throwaway hacks — they need to be production-quality
    so a positive result can be integrated as-is
  - Do NOT put experiments in /tmp/, /scratch/, or named with -temp / -wip suffixes
    — they live in the same places as keeper code
  - Do NOT skip type safety, naming, or error handling 'because it's just an experiment'
  - Do NOT refuse to integrate a successful experiment because 'it was exploratory'
    — that misreads what the user asked for
  - Do NOT include cleanup steps in the plan for an experiment — there is no cleanup
    if the result is positive
  related_terms:
  - feature request
  - duplication
  defined_in: CLAUDE.md
  added_at: '2026-05-18T17:33:13.647647+00:00'
  added_by: vocabulary_add
- term: duplication
  category: noun
  definition: 'Parallel re-implementations of the same logic — 4 different ways to
    do one thing, with nothing canonical. ANY logic called at 2+ sites is a reusable
    utility, not a re-write. Distinct from ITERATION (trying repeatedly until something
    works) which is fine. The user''s explicit example of the bad case: LLMs writing
    the same math function 30 different times. (''So stupid to me.'')'
  antipatterns:
  - Do NOT write the same math/utility logic inline at multiple call sites — extract
    to a utility on the SECOND call site, not the fifth
  - Do NOT add 'one more variant' of an existing function — find the canonical one
    and either use it or replace it
  - Do NOT confuse iteration (re-try → success) with duplication (parallel re-implementations)
    — iteration is fine; parallel re-implementations are not
  - Do NOT skip the 'is there already one of these?' search before writing a math/string/array
    helper — there usually is
  - Do NOT defend duplication with 'it was simpler inline' or 'they might diverge
    later' — if both call sites do the same thing today, they share a utility today
  related_terms:
  - experiment
  - feature request
  defined_in: CLAUDE.md
  added_at: '2026-05-18T17:33:20.228328+00:00'
  added_by: vocabulary_add
- term: fold
  category: verb
  definition: 'To take the idea of one thing and the idea of another and coherently
    mend them together — WITHOUT removing any functionality from either side, unless
    explicitly told to drop something. The defining property: a fold preserves the
    full union of behaviors from both inputs; nothing silently disappears.'
  antipatterns:
  - Do NOT drop features from either side during a fold — preservation of all functionality
    is the default contract
  - Do NOT decide unilaterally that something is 'redundant' and prune it — if both
    sides do it, the fold keeps it; explicit instruction required to remove
  - Do NOT lose edge-case handling, options, parameters, or call sites — folding is
    additive coherence, not simplification
  - Do NOT treat 'fold' as a synonym for 'refactor', 'replace', or 'consolidate' —
    those can lose functionality; fold cannot
  - Do NOT collapse two configurable surfaces into one less-configurable surface —
    both knobs survive the fold unless told otherwise
  related_terms:
  - duplication
  - feature request
  defined_in: CLAUDE.md
  added_at: '2026-05-18T17:44:58.520959+00:00'
  added_by: vocabulary_add
- term: extend
  category: verb
  definition: 'In the context of a cart, ''extend'' is an early-warning signal: this
    module has momentum and is heading somewhere bigger. The user''s framing: ''this
    is going somewhere, likely you should avoid a god file now before this gets to
    a point where its painful to manage.'' Translation: the request is not just ''add
    functionality'' — it is ''add functionality AND modularize preemptively so the
    cart doesn''t collapse into one giant file.'''
  antipatterns:
  - Do NOT just pile new code into the existing single .tsx file when asked to 'extend'
    a cart — split into components/modules now, before the file gets painful
  - Do NOT wait until a file is 'too big' to refactor — 'extend' is the user authorizing
    the split in advance
  - Do NOT argue 'it's only N more lines, splitting is premature' — the user just
    told you they see momentum and want the structure preemptively
  - Do NOT treat 'extend' as a plain synonym for 'add a feature' — it carries 'AND
    keep the file shape sane' as a co-instruction
  - Do NOT use 'extend' to mean OOP extension or class inheritance — this is cart-level
    architecture, not language-level subclassing
  related_terms:
  - cart
  - feature request
  - duplication
  defined_in: cart/
  added_at: '2026-05-18T17:46:43.388438+00:00'
  added_by: vocabulary_add
- term: super sucks
  category: phrase
  definition: 'A verdict that the UX has completely missed the bar — the result is
    unintelligible to a normal person and only someone autistic could parse it. The
    user notes this happens often when ideas get piled together without design coherence:
    cards stack, controls fragment, info-density spikes, naming drifts, and the surface
    stops being something a real human could use without a manual.'
  antipatterns:
  - Do NOT respond to 'super sucks' by explaining how the implementation works — that
    defense IS the problem; the user can already see the surface and it failed
  - Do NOT iterate by adding MORE features, labels, modes, or affordances — strip
    back, consolidate, simplify; the fix is removal and clarity, not addition
  - Do NOT dismiss it as subjective taste — it is a verdict on coherence and discoverability,
    judged from a non-coder's POV (see [[user_role]])
  - Do NOT treat it as a small adjustment — it is a design-rework signal, not a polish
    pass
  - Do NOT keep the same visual structure and just rename things — if the shape was
    unintelligible, the shape itself needs to change
  related_terms:
  - didn't change from my POV
  - feature request
  - duplication
  - user_role
  defined_in: CLAUDE.md
