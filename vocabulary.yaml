  category: phrase
  definition: 'The look-authoring layer of hmsc-int: shaders + decals (+ images) are
    tuned, then Materialized into materials in a library.'
  antipatterns:
  - Do NOT conflate the art layer with the paint layer (placing tile kinds + colors)
    or the texture layer (assigning materials).
  related_terms: []
  defined_in: cart/hmsc-int/tabs/ObjectsTab.tsx
  added_at: '2026-05-31T22:23:15.651921+00:00'
  added_by: vocabulary_add
- term: paint layer
  category: phrase
  definition: 'The map-authoring layer: lay tile KINDS + flat colors on the 2D grid
    (the PaintCanvas). Carries structure + gameplay (a sidewalk walks/sounds like
    a sidewalk).'
  antipatterns:
  - Do NOT conflate the paint layer with assigning materials — that is the texture
    layer. Paint sets kind + color, not the material look.
  related_terms: []
  defined_in: cart/hmsc-int/PaintCanvas.tsx
  added_at: '2026-05-31T22:23:15.814409+00:00'
  added_by: vocabulary_add
- term: texture layer
  category: phrase
  definition: 'The dressing layer: assign library materials onto painted tiles AND
    building/object faces, via the per-placement material slot (render.textureKey).
    A cell defaults to its kind material until overridden here.'
  antipatterns:
  - Do NOT use texture here to mean the raw pixel image — this layer is the ASSIGNMENT
    of a material to a surface, not the pixels.
  related_terms: []
  defined_in: cart/hmsc-int/PropertiesPanel.tsx
  added_at: '2026-05-31T22:23:15.977186+00:00'
  added_by: vocabulary_add
