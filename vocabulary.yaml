- term: feature request
  category: phrase
  definition: 'The user''s default mode for any unqualified request. A feature request
    is a FULL VERTICAL SLICE delivered as three explicit pieces: (1) the host work
    (Zig, in framework/), (2) a binding that exposes the host capability across the
    bridge, (3) a cart-facing useX hook in runtime/ importable from any cart. "Public"
    means specifically: there is a useX hook in runtime/ that any cart can import
    in one line. Anything less is shallow.'
  antipatterns:
  - Do NOT deliver only the cart-side of a feature — without host + binding it has
    nothing to do
  - Do NOT deliver only the host-side or a private helper — without a binding and
    a useX hook, no cart can reach it; the feature isn't public
  - Do NOT add a binding without a useX hook to consume it — the binding exposes the
    bridge, but the hook is what makes the feature one-line-usable from a cart
  - Do NOT build a shallow module that just wraps a single subsystem call — a feature
    is a full vertical slice
  - Do NOT scope down 'to keep it minimal' without explicit go-ahead — 99.9% of requests
    want the full thing
  - Do NOT split a feature request across multiple sessions unless explicitly told
    — deliver the slice end-to-end in one shot
  related_terms:
  - host
  - bindings
  - bridge
  - cart
  - runtime
  - feedback_full_scope
