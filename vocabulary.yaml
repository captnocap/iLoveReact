entries:
- term: cart
  category: noun
  definition: A .tsx app under cart/. Each cart compiles to one self-extracting binary
    via ./scripts/ship <name>. Cart name == directory/file basename.
  antipatterns:
  - NOT a shopping cart, vehicle, or container concept
  - NOT an arbitrary React project — carts have a fixed runtime shape (V8 host + bundled
    bundle.js + embedded assets)
  - Do NOT add new .jsx/.js files in cart/; carts are .tsx/.ts only
  related_terms:
  - ship
  - dev
  - bundle
  - primitive
  defined_in: CLAUDE.md
  added_at: '2026-05-18T16:42:36.159688+00:00'
  added_by: vocabulary_add
- term: Smith
  category: noun
  definition: The frozen Smith-era compiler stack in tsz/. A 50-day detour preserved
    for reference only. Reading allowed; modification forbidden.
  antipatterns:
  - Do NOT restart Smith work, port .tsz mechanically, or run d-suite against root
    code
  - Do NOT chmod or unlock tsz/ — it is intentionally read-only
  - Do NOT treat Smith patterns as authoritative; regenerate fresh in .tsx instead
  related_terms:
  - tsz
  - d-suite
  - conformance
  defined_in: CLAUDE.md
  added_at: '2026-05-18T16:42:39.110690+00:00'
  added_by: vocabulary_add
- term: tsz
  category: noun
  definition: 'The frozen tsz/ directory: Smith compiler, d-suite conformance, cockpit/Sweatshop
    .tsz carts, InspectorTsz tools. Read-only reference.'
  antipatterns:
  - Do NOT modify any file under tsz/
  - Do NOT port .tsz code mechanically to .tsx; regenerate from love2d/ patterns instead
  - tsz is not a file extension we author against; .tsx is the only authoring format
  related_terms:
  - Smith
  - archive
  - love2d
  defined_in: CLAUDE.md
  added_at: '2026-05-18T16:42:42.746591+00:00'
  added_by: vocabulary_add
- term: ship
  category: verb
  definition: ./scripts/ship <cart> — the one and only build path. Bundles cart .tsx
    via esbuild → bundle.js → Zig compiles host with @embedFile → Linux self-extracting
    wrapper or macOS .app. Always release mode.
  antipatterns:
  - Do NOT pass -d or --raw; both were removed 2026-05-04. -d binary crashes on click.
  - Do NOT pgrep-wait for 'zig build' before invoking ship; ship has internal flock
    and the polling shell self-matches
  - Do NOT shell out to npm/node/bun directly for build steps; ship orchestrates the
    whole pipeline via tools/v8cli
  related_terms:
  - dev
  - cart
  - bundle
  - V8
  defined_in: scripts/ship
  added_at: '2026-05-18T16:42:46.430563+00:00'
  added_by: vocabulary_add
- term: dev
  category: verb
  definition: ./scripts/dev <cart> launches a persistent ReleaseFast dev host with
    hot reload for cart/ + runtime/ TSX. Editing .tsx re-bundles+re-evals in ~300ms.
    A second 'dev <other>' pushes to the running host and adds a tab.
  antipatterns:
  - Do NOT restart ./scripts/dev after every edit — the user has an auto-push watcher
    already running
  - Hot reload does NOT cover framework/, build.zig, or scripts/ — those changes require
    a fresh ship
  - Do NOT assume useHotState preserves state — wiring exists but it currently resets
    every reload
  related_terms:
  - ship
  - useHotState
  - cart
  defined_in: scripts/dev
  added_at: '2026-05-18T16:42:51.042953+00:00'
  added_by: vocabulary_add
- term: framework
  category: noun
  definition: 'The Zig runtime in framework/: layout, engine, GPU, events, input,
    state, effects, text, windows. Consumes the React reconciler''s CREATE/APPEND/UPDATE
    mutation stream.'
  antipatterns:
  - Do NOT confuse with 'React framework' or any JS-side concept — framework is Zig
    only
  - Changes under framework/ require a rebuild via ship; they are NOT covered by ./scripts/dev
    hot reload
  related_terms:
  - runtime
  - renderer
  - ship
  defined_in: framework/
  added_at: '2026-05-18T16:42:54.200485+00:00'
  added_by: vocabulary_add
- term: runtime
  category: noun
  definition: 'The JS-side runtime/ directory: JSX shim, primitives, hooks, host globals,
    classifier, highlighter. Runs inside V8 inside the cart host binary.'
  antipatterns:
  - Do NOT confuse 'runtime' with 'V8' — V8 is the JS engine, runtime/ is our cart-facing
    JS layer on top of it
  - Do NOT confuse with framework/ — framework is Zig, runtime is JS
  related_terms:
  - framework
  - renderer
  - V8
  - primitive
  defined_in: runtime/
  added_at: '2026-05-18T16:42:57.080628+00:00'
  added_by: vocabulary_add
- term: primitive
  category: noun
  definition: 'A built-in component the reconciler emits as a CREATE with a fixed
    type string. Set: Box, Row, Col, Text, Image, Pressable, ScrollView, TextInput,
    TextArea, TextEditor, Canvas (+ .Node/.Path/.Clamp), Graph (+ .Path/.Polyline/.Node),
    Native.'
  antipatterns:
  - Do NOT call arbitrary React components 'primitives' — primitives are the closed
    set the Zig host knows about
  - Do NOT mix text and expressions in <Text> children; use a template literal
  related_terms:
  - Native
  - renderer
  - Canvas
  - Graph
  defined_in: runtime/
  added_at: '2026-05-18T16:43:00.991641+00:00'
  added_by: vocabulary_add
- term: Native
  category: noun
  definition: <Native type="X" /> — the universal escape-hatch primitive. Reconciler
    emits CREATE with that type string; the Zig host dispatches on it.
  antipatterns:
  - Do NOT read 'Native' as 'native code' or 'platform-native UI' — it is a specific
    primitive name
  - Do NOT introduce new top-level primitive types when Native already covers it
  related_terms:
  - primitive
  - framework
  defined_in: runtime/
  added_at: '2026-05-18T16:43:04.305877+00:00'
  added_by: vocabulary_add
- term: theme:NAME
  category: convention
  definition: String color tokens of the form 'theme:text', 'theme:bg', etc. Resolved
    at paint time against the active skin so light/dark surfaces flip correctly.
  antipatterns:
  - 'Do NOT write hardcoded #hex or rgba() literals in cart code or classifier .cls
    sheets — only theme files own raw colors'
  - 'Do NOT inline color: ''#xxx'' in style objects — skins flip surfaces and the
    text becomes invisible (#e7eaff on win7''s #dfe8f3)'
  - If a token doesn't exist for the color you want, ADD a token to the theme — do
    not paste a literal
  related_terms:
  - classifier
  - skin
  defined_in: cart/app/gallery/gallery-theme.ts
  added_at: '2026-05-18T16:43:08.503128+00:00'
  added_by: vocabulary_add
- term: Effect
  category: noun
  definition: <Effect shader="..."> — a WGSL fragment-shader quad. Used for fills,
    gradients, scalar fields, analytic rings (donut/pie/contour/heatmap). Pixel-perfect
    at any zoom, no geometry.
  antipatterns:
  - Do NOT confuse with React's useEffect — they share the word but nothing else
  - Do NOT draw multi-segment outlines in an Effect shader — fwidth spikes at segment-derivative
    kinks leak a visible halo ('broken circle' artifact). Use Graph.Polyline instead.
  - 'WGSL: no unary +. ''+0.85'' crashes shader-module creation; use ''0.85''. No
    backticks in shader comments — they end the JS template literal.'
  related_terms:
  - Filter
  - Polyline
  - Canvas
  - Graph
  defined_in: framework/gpu/
  added_at: '2026-05-18T16:43:19.484854+00:00'
  added_by: vocabulary_add
- term: Filter
  category: noun
  definition: <Filter shader="..."> — a WGSL fragment-shader applied as a filter pass
    over its subtree.
  antipatterns:
  - 'MUST receive style={{ width: ''100%'', height: ''100%'' }} or the cart hard-crashes
    at load with no log. First thing to check when a Filter cart silently fails to
    launch.'
  - Do NOT confuse with Effect — Filter is a pass over a subtree; Effect is a standalone
    quad
  related_terms:
  - Effect
  defined_in: framework/gpu/
  added_at: '2026-05-18T16:43:23.401493+00:00'
  added_by: vocabulary_add
- term: Polyline
  category: noun
  definition: <Graph.Polyline> — multi-segment stroke rendered via per-segment analytic
    capsules from framework/gpu/capsules.zig. The correct tool for radar webs, axis
    spokes, polygon outlines, polylines.
  antipatterns:
  - Do NOT attempt multi-segment outlines in a single fragment shader — every formulation
    leaks at segment-derivative kinks via fwidth
  - Do NOT replace Polyline with a stroke-in-Effect 'optimization' — it has been tried
    in every formulation and always produces the broken-circle halo
  related_terms:
  - Effect
  - Graph
  defined_in: framework/gpu/capsules.zig
  added_at: '2026-05-18T16:43:27.385023+00:00'
  added_by: vocabulary_add
- term: Canvas
  category: noun
  definition: '<Canvas> — pan-zoomable surface using gx/gy/gw/gh coordinate-space
    positioning. Children: Canvas.Node, Canvas.Path, Canvas.Clamp. Paths support SVG
    d/stroke/strokeWidth/fill.'
  antipatterns:
  - Do NOT confuse Canvas (pan-zoom, world-coord) with Graph (static-viewport)
  - Do NOT use HTML px coordinates on Canvas children — use gx/gy in world space
  related_terms:
  - Graph
  - primitive
  defined_in: runtime/
  added_at: '2026-05-18T16:43:29.546883+00:00'
  added_by: vocabulary_add
- term: Graph
  category: noun
  definition: '<Graph> — static-viewport drawing surface. Children: Graph.Path, Graph.Polyline,
    Graph.Node. Uses gx/gy/gw/gh coordinate-space positioning.'
  antipatterns:
  - Do NOT confuse Graph (static viewport) with Canvas (pan-zoom)
  - Do NOT confuse with 'graph' as in network/data-structure — this is the drawing
    primitive
  related_terms:
  - Canvas
  - Polyline
  - primitive
  defined_in: runtime/
  added_at: '2026-05-18T16:43:33.797112+00:00'
  added_by: vocabulary_add
- term: StaticSurface
  category: noun
  definition: A paint-cache wrapper that caches its subtree's paint to a GPU quad
    while the React children stay live. Worth using on grids of >~10 cards.
  antipatterns:
  - Do NOT blame StaticSurface for state or re-render bugs — children remain live
    React. The cache is paint-only.
  - Do NOT wrap small/cheap subtrees in StaticSurface — the cache cost outweighs the
    paint savings
  related_terms:
  - primitive
  defined_in: runtime/
  added_at: '2026-05-18T16:43:35.606234+00:00'
  added_by: vocabulary_add
- term: Explore
  category: convention
  definition: The built-in Explore/Task/Agent subagent tool. BANNED in this repo.
  antipatterns:
  - Do NOT invoke Explore, Agent, or any Task subagent — measured ~57% false-claim
    rate on this codebase (e.g., claimed frozen tsz/ contained .map() when it did
    not)
  - Do NOT delegate 'does this feature exist?' to a subagent — read source directly
    with Read/Grep/Glob/Bash
  - When in plan mode, write the plan yourself — do NOT spawn a Plan subagent (loses
    context, burns tokens)
  related_terms:
  - supervisor
  - worker
  defined_in: CLAUDE.md
  added_at: '2026-05-18T16:43:40.187377+00:00'
  added_by: vocabulary_add
- term: debug build
  category: phrase
  definition: A non-release build of a cart. Historically invoked as 'scripts/ship
    <cart> -d'. The -d flag was REMOVED on 2026-05-04 because the produced binary
    crashes on click.
  antipatterns:
  - Do NOT attempt scripts/ship -d — the flag is gone and the binary it produced was
    unusable
  - Do NOT downgrade scripts/dev to Debug — it silently crashes on click. Always ReleaseFast.
  - If a cart crashes on launch or click, the first hypothesis is NOT 'try a debug
    build for more info' — release IS the working configuration here
  related_terms:
  - ship
  - dev
  defined_in: CLAUDE.md
  added_at: '2026-05-18T16:43:44.338356+00:00'
  added_by: vocabulary_add
- term: node
  category: noun
  definition: 'Ambiguous between four senses in this repo: (1) a React reconciler
    element, (2) <Canvas.Node>, (3) <Graph.Node>, (4) Node.js the runtime. Sense (4)
    is BANNED — use bun or tools/v8cli for any .mjs/.js script.'
  antipatterns:
  - Do NOT invoke the 'node' binary in this repo — every former 'node scripts/X.mjs'
    now runs under tools/v8cli, and any ad-hoc .mjs/.js script runs under bun
  - Do NOT use 'node' bare in conversation without disambiguating — clarify React-node,
    Canvas.Node, Graph.Node, or Node.js
  related_terms:
  - V8
  - bundle
  - Canvas
  - Graph
  defined_in: CLAUDE.md
  added_at: '2026-05-18T16:43:48.813144+00:00'
  added_by: vocabulary_add
- term: V8
  category: noun
  definition: The default JS runtime, embedded via zig-v8 (~6MB standalone). scripts/ship
    builds V8. The 'V8 is bloated' myth confuses V8 with Chromium (~200MB CEF); standalone
    V8 is small.
  antipatterns:
  - Do NOT propose switching to a smaller engine 'for performance' — V8 is fast and
    not the bottleneck. The historical click-latency bug was a synchronous npx tsc
    call in the reconciler path, not the engine.
  - Do NOT build new features on QJS bindings or qjs_app.zig — QJS is maintenance-only
    legacy
  related_terms:
  - QJS
  - runtime
  - ship
  defined_in: CLAUDE.md
  added_at: '2026-05-18T16:43:52.276911+00:00'
  added_by: vocabulary_add
- term: QJS
  category: acronym
  definition: QuickJS. Legacy JS runtime; maintenance-only. Opt-in via --qjs. The
    default cart runtime is V8.
  antipatterns:
  - Do NOT build new features on qjs_app.zig or QJS bindings
  - Do NOT recommend QJS as a 'smaller alternative' to V8 — V8 standalone is ~6MB;
    the size myth is about Chromium
  related_terms:
  - V8
  - runtime
  defined_in: CLAUDE.md
  added_at: '2026-05-18T16:44:02.121801+00:00'
  added_by: vocabulary_add
- term: supervisor
  category: noun
  definition: The orchestrating Claude session in a multi-pane kitty layout. Coordinates
    parallel worker sessions; does not lose context to subagents.
  antipatterns:
  - Do NOT have a supervisor spawn Task/Agent/Explore subagents — supervisor goes
    blind and downstream workers can't see results
  - Do NOT loop on git status when the tree is unexpectedly clean — run git log --oneline
    -5 once; another worker committed it
  related_terms:
  - worker
  - Explore
  defined_in: CLAUDE.md
  added_at: '2026-05-18T16:44:05.193663+00:00'
  added_by: vocabulary_add
- term: useTheInternet
  category: noun
  definition: 'Planned umbrella networking hook that routes by request shape into
    the trichotomy: useHost (server-shaped), fetch (one-shot client), useConnection
    (bidirectional). Transports (tor/wg/socks5) compose via a ''via:'' handle; protocol
    is selected by a ''kind'' field.'
  antipatterns:
  - Do NOT plan around libcurl — backend is std.http + tls.zig + nghttp2
  - Do NOT propose a fourth direction — every networking need fits one of the three
    hooks
  - 'Do NOT bake transport into protocol — via: is composable across all three'
  related_terms:
  - useHost
  - useConnection
  - fetch
  defined_in: runtime/hooks/
  added_at: '2026-05-18T16:44:15.075793+00:00'
  added_by: vocabulary_add
- term: useDuring
  category: noun
  definition: 'Planned polymorphic hook: useDuring(x, y) runs y for the lifetime of
    x. Dispatches on x''s type — bool, promise, timer, signal, iterator, function,
    mount. Design agreed; awaiting impl in runtime/hooks/useDuring.ts.'
  antipatterns:
  - Do NOT special-case useDuring per type at the call site — dispatch is the hook's
    job
  - Do NOT confuse with useEffect — useEffect runs once on a dep change; useDuring
    runs FOR the duration of x
  related_terms:
  - useHotState
  defined_in: runtime/hooks/
  added_at: '2026-05-18T16:44:17.734269+00:00'
  added_by: vocabulary_add
- term: useHotState
  category: noun
  definition: Hook intended to preserve component state across hot reloads. Wiring
    exists in framework/hotstate.zig + the hook, but state preservation is NOT working
    yet — state resets on every reload.
  antipatterns:
  - Do NOT assume useHotState persists across reloads in cart code — it currently
    does not
  - Do NOT mark related dev workflows 'done' once useHotState compiles — verify state
    survives an actual reload first
  related_terms:
  - dev
  defined_in: framework/hotstate.zig
  added_at: '2026-05-18T16:44:21.364994+00:00'
  added_by: vocabulary_add
- term: bucket
  category: noun
  definition: One of 8 separate postgres databases in the multi-DB shape. Each bucket
    is intentionally a distinct DB; the split is load-bearing.
  antipatterns:
  - Do NOT propose collapsing the 8 buckets into one DB
  - Do NOT plan migrations or ALTERs against embedded pg data — pg state is shape-finding
    scratch; drop and recreate is the right move
  - Do NOT preserve pg data across schema changes 'just in case' — the bucket schema
    is intentionally throwaway
  related_terms:
  - embed-bench
  defined_in: framework/
  added_at: '2026-05-18T16:44:25.576257+00:00'
  added_by: vocabulary_add
- term: d-suite
  category: phrase
  definition: The Smith-era conformance-test machinery under tsz/. Frozen. Reference
    only.
  antipatterns:
  - Do NOT run d-suite against root-level (.tsx) work — it is Smith-specific and irrelevant
    to the .tsx stack
  - Do NOT write new conformance tests against root work using d-suite patterns
  - Do NOT invoke the flight-check-loop, chad-audit, or conformance skills against
    root code — they are retained only for the frozen tsz/ tree
  related_terms:
  - Smith
  - tsz
  - conformance
  defined_in: tsz/
  added_at: '2026-05-18T16:44:28.274467+00:00'
  added_by: vocabulary_add
- term: main-only
  category: convention
  definition: 'This repo lives on main. No feature branches. The only safe git commands
    are: add (specific paths), commit, push, status, log, diff.'
  antipatterns:
  - Do NOT git checkout -b, git switch, or otherwise create branches
  - Do NOT git add -A or git commit -a — multiple worker sessions share the tree;
    stage by explicit path
  - Do NOT punt on committing with 'want me to?' — when prompted to commit, just commit
    (logical chunks, hold back files actively edited elsewhere)
  related_terms:
  - worker
  - supervisor
  defined_in: CLAUDE.md
  added_at: '2026-05-18T16:44:31.641827+00:00'
  added_by: vocabulary_add
- term: disk is truth
  category: phrase
  definition: When reading files, the on-disk content is authoritative. The git index
    / staged version is transient because workers fold stage+disk at commit time.
  antipatterns:
  - Do NOT read the staged/index version of a file when investigating behavior — it
    diverges from what is actually executing
  - Do NOT trust 'git diff --cached' as a description of current state — read the
    files
  related_terms:
  - worker
  - main-only
  defined_in: memory/feedback_disk_is_truth.md
  added_at: '2026-05-18T16:44:35.326456+00:00'
  added_by: vocabulary_add
- term: commit
  category: noun
  definition: A git commit. The unit of work pushed to main. This term is git-only
    in this project.
  antipatterns:
  - Do NOT use 'commit' to refer to React's commit phase — the user does not use the
    word that way. Say mount / render / update instead.
  - Do NOT git add -A or git commit -a — stage explicit paths only because workers
    share the tree
  - Do NOT branch — commits go to main directly
  related_terms:
  - main-only
  - worker
  defined_in: CLAUDE.md
  added_at: '2026-05-18T16:50:06.594248+00:00'
  added_by: vocabulary_add
- term: mount/render/update
  category: phrase
  definition: The user's preferred vocabulary for React component lifecycle. 'mount'
    = first render after creation; 'render' = component function execution producing
    UI; 'update' = re-render triggered by state/prop change.
  antipatterns:
  - Do NOT call any React lifecycle event a 'commit' — that word is reserved for git
    in this project
  - Do NOT introduce React-internal jargon (commit phase, reconciliation pass) in
    user-facing explanations — stay in mount/render/update
  related_terms:
  - commit
  - primitive
  defined_in: runtime/
  added_at: '2026-05-18T16:50:10.040415+00:00'
  added_by: vocabulary_add
- term: tick
  category: noun
  definition: The framework's heartbeat — a tickrate that runs regardless of whether
    anything is animating. Always on. Animations are one consumer of ticks, not the
    source.
  antipatterns:
  - Do NOT scope 'tick' to animation contexts — it is the always-on framework heartbeat
  - Do NOT skip/gate ticks based on 'nothing is moving' — other systems depend on
    the steady heartbeat
  related_terms:
  - frames
  defined_in: framework/engine.zig
  added_at: '2026-05-18T16:50:13.258639+00:00'
  added_by: vocabulary_add
- term: fps
  category: noun
  definition: Rendered frames per second. The user's universal quality metric for
    whether an approach is acceptable. Holding fps = good approach; dropping fps =
    bad approach, regardless of any other 'correctness' it claims. Term trigger is
    intentionally 'fps' only — 'frames' as a verb form (e.g. 'Claude frames things
    in human-time') used to cause false positives.
  antipatterns:
  - Do NOT justify a slow approach with theoretical merit if it drops fps — frame-stability
    is the override
  - Do NOT measure performance with synthetic microbenchmarks when fps impact is what
    matters
  - Do NOT recommend an architecture without considering its fps cost; an approach
    that loses frames is, by definition, the wrong approach
  related_terms:
  - tick
  defined_in: framework/
  added_at: '2026-05-18T16:50:17.002661+00:00'
  added_by: vocabulary_add
- term: style
  category: verb
  definition: To apply styling via a classifier .cls.ts sheet. In this project 'style
    this', 'styling', 'style sheets' ALL refer exclusively to the classifier system.
    Classifier files end in .cls.ts.
  antipatterns:
  - Do NOT interpret 'style' as inline style={} props — when the user says 'style
    this' they mean classifier sheets
  - Do NOT interpret 'style sheets' as CSS, Tailwind, or styled-components — the only
    style system here is .cls.ts
  - Do NOT propose extracting styles to a new system when asked to 'style' something
    — extend or write a .cls.ts file
  related_terms:
  - classifier
  - theme:NAME
  defined_in: cart/app/gallery/components.cls.ts
  added_at: '2026-05-18T16:50:22.074695+00:00'
  added_by: vocabulary_add
- term: classifier
  category: noun
  definition: The styling system, authored in .cls.ts files. When the user says 'style',
    'styling', or 'style sheets', they mean classifier. Colors are referenced as 'theme:NAME'
    tokens.
  antipatterns:
  - Do NOT introduce CSS, Tailwind utility strings, or styled-components alongside
    classifier — classifier is the only styling layer
  - Do NOT use hex/rgba color literals in .cls.ts — only theme:NAME tokens; theme
    definition files own raw colors
  - Do NOT confuse with the Smith-era classifier in tsz/ — that is frozen and unrelated
  related_terms:
  - style
  - theme:NAME
  defined_in: cart/app/gallery/components.cls.ts
  added_at: '2026-05-18T16:50:25.305612+00:00'
  added_by: vocabulary_add
- term: bridge
  category: noun
  definition: The runtime phenomenon of communication happening between Zig and JS.
    Ephemeral — it only exists DURING communication. The bridge is the act/channel,
    not a static layer. It exists regardless of what's exposed to it; what's exposed
    is determined by bindings. "The bridge just means it has a place to run."
  antipatterns:
  - Do NOT describe the bridge as a static layer or boundary — it is the runtime act
    of communication, an ephemeral state during cross-language calls
  - Do NOT conflate bridge with bindings — bridge is the channel that carries traffic;
    bindings are the static declarations that say WHAT can be carried
  - Do NOT call it 'the renderer', 'the reconciler', or 'the host config' when speaking
    with the user — those names don't match the user's mental model
  - Do NOT model events, input, or state-sync as separate boundaries — they all flow
    over the bridge
  related_terms:
  - bindings
  - framework
  - runtime
  - host
  defined_in: runtime/
  added_at: '2026-05-18T16:57:06.674198+00:00'
  added_by: vocabulary_add
- term: host
  category: noun
  definition: The Zig side of the stack. The host is the cart binary (Zig) that runs
    V8 + the framework. In networking discussion the same Zig side is sometimes called
